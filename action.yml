# Reads the commits a tag added and turns them into grouped release notes with
# an OpenAI-compatible model. Nothing here is specific to one product: the
# caller names the tag and says what the project is.
#
# The repository must be checked out with its full history and tags
# (actions/checkout with fetch-depth: 0).
#
# The action does not fail the job when the model does. The output file then
# holds the commit list unchanged and `failed` is 1, so a release still gets
# published -- for a repository whose release page is the distribution, losing
# the page is worse than losing the prose.

name: AI release notes
description: 讀出一個 tag 帶進來的 commit，交給 OpenAI 相容的模型整理成分組的發版說明；呼叫失敗就交回 commit 清單。

inputs:
  tag:
    description: 要發版的 tag。
    required: true
  tag-pattern:
    description: 哪些 tag 算是舊版本，用來找上一版。同一份歷史發兩個東西的 repo 有兩種前綴，挑錯就算錯區間。
    default: "*"
  previous-tag:
    description: 直接指定上一版，填了就不去找。
    default: ""
  exclude-paths:
    description: 不列入的路徑，逗號或換行分隔。
    default: ""
  exclude-types:
    description: 要濾掉的 conventional commit 類型，逗號分隔。
    default: ci,chore
  limit:
    description: 最多送出幾筆 commit。
    default: "40"
  context:
    description: 這個專案是什麼、讀者是誰。接在寫作規則前面交給模型。
    default: ""
  base-url:
    description: OpenAI 格式端點的網址，接到 /chat/completions 之前為止。留空時取環境變數 AI_BASE_URL，再留空就是 https://api.openai.com/v1。
    default: ""
  model:
    description: 模型代號。留空時取環境變數 AI_MODEL；兩邊都空就不呼叫。
    default: ""
  api-key:
    description: 該端點的金鑰，以 bearer token 送出。留空時取環境變數 AI_API_KEY。
    default: ""
  extra-headers:
    description: 額外的請求標頭，一行一個 `Name: value`。模型前面那層閘道要的東西，例如 Cloudflare AI Gateway 開了認證時的 cf-aig-authorization。
    default: ""

outputs:
  file:
    description: 產生的 markdown 檔路徑。模型失敗時內容是 commit 清單。
    value: ${{ steps.notes.outputs.file }}
  failed:
    description: 模型沒有寫出說明時為 1，其餘為 0。
    value: ${{ steps.notes.outputs.failed }}
  previous-tag:
    description: 找到的上一版 tag，沒有就是空的。
    value: ${{ steps.notes.outputs.previous-tag }}
  range:
    description: 實際使用的 commit 區間。
    value: ${{ steps.notes.outputs.range }}

runs:
  using: composite
  steps:
    - id: notes
      shell: bash
      env:
        TAG: ${{ inputs.tag }}
        TAG_PATTERN: ${{ inputs.tag-pattern }}
        PREVIOUS_TAG: ${{ inputs.previous-tag }}
        EXCLUDE_PATHS: ${{ inputs.exclude-paths }}
        EXCLUDE_TYPES: ${{ inputs.exclude-types }}
        LIMIT: ${{ inputs.limit }}
        CONTEXT: ${{ inputs.context }}
        INPUT_BASE_URL: ${{ inputs.base-url }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_API_KEY: ${{ inputs.api-key }}
        INPUT_EXTRA_HEADERS: ${{ inputs.extra-headers }}
      run: bash "$GITHUB_ACTION_PATH/notes.sh"
